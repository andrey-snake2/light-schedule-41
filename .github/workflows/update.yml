
name: Update electricity schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "10,40 * * * *"
    - cron: "25,55 * * * *"

permissions:
  contents: write

concurrency:
  group: electricity-schedule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Request and verify schedule
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python update_schedule.py

      - name: Publish verified schedule
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("schedule_test.json")
          if not source.is_file():
              raise SystemExit("Verified schedule not found")

          data = json.loads(source.read_text(encoding="utf-8"))

          assert data["queue"] == "4.1"
          assert len(data["hours"]) == 24
          assert len(data["halfHours"]) == 48
          assert all(x in (0, 1, 2) for x in data["halfHours"])
          assert sum(x != 0 for x in data["halfHours"]) * 30 == data["totalOutageMinutes"]
          assert data.get("date"), "Schedule date missing"

          Path("schedule.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule.json

          if ! git diff --cached --quiet; then
            git commit -m "Update verified electricity schedule"
            git push
          else
            echo "Schedule unchanged"
          fi
