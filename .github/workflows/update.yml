      - name: Publish verified schedule
        run: |
          python -c "import json, pathlib; s=json.loads(pathlib.Path('schedule_test.json').read_text(encoding='utf-8')); assert s['queue']=='4.1'; assert len(s['hours'])==24; assert len(s['halfHours'])==48; assert sum(x != 0 for x in s['halfHours'])*30==s['totalOutageMinutes']; pathlib.Path('schedule.json').write_text(json.dumps(s, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule.json

          if ! git diff --cached --quiet; then
            git commit -m "Update verified electricity schedule"
            git push
          else
            echo "Schedule unchanged"
          fi